# Drop-in configuration for fprintd on Apple T2 Macs (Ubuntu 24.04 LTS)
# Connects libfprint virtual storage device to t2-touchid bridge
[Unit]
Requires=t2-touchid.service
After=t2-touchid.service

[Service]
Environment=FP_VIRTUAL_DEVICE_STORAGE=/run/t2-touchid/fprint.sock
ReadWritePaths=/run/t2-touchid
RuntimeDirectory=t2-touchid
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=yes

